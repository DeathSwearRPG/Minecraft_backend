spring:
  application:
    name: minecraft-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/project_db
    username: postgres
    password: postgres

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true

    flyway:
      enabled: true

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always