spring:
  application:
    name: minecraft-backend

  data:
    mongodb:
      uri: mongodb://localhost:27017/minecraft_wiki

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/minecraft-wiki

      client:
        registration:
          keycloak:
            client-id: minecraft-backend
            client-secret: 5lxE6gaXBQtAtWKTnV6oEHLxjrkf1Don
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/minecraft-wiki

keycloak:
  logout-uri: http://localhost:8081/realms/minecraft-wiki/protocol/openid-connect/logout
  post-logout-redirect-uri: http://localhost:5173/admin

mongock:
  migration-scan-package:
    - com.minecraft_wiki.backend.config.migration
  transactions: false

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
  servlet:
    session:
      cookie:
        name: MINECRAFT_WIKI_BACKEND_SESSION

minecraftServer:
  rcon:
    host: 127.0.0.1
    port: 25575
    password: test_password

s3:
  endpoint: http://localhost:9000
  region: us-east-1
  bucket: minecraft-wiki-images
  access-key: admin
  secret-key: adminadmin