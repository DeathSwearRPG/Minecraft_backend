
version: "3.9"

services:

  mongodb:
    image: mongo:7
    container_name: project_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - project_network

  mongo-express:
    image: mongo-express:latest
    container_name: project_mongo_express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb
    networks:
      - project_network

volumes:
  mongodb_data:

networks:
  project_network:
    driver: bridge