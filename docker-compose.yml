
services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: minecraft_keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: 147852
    ports:
      - "8081:8080"
    networks:
      - project_network

  minio:
    image: minio/minio:latest
    container_name: minecraft_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - project_network

  mongodb:
    image: mongo:7
    container_name: project_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - project_network

  mongo-express:
    image: mongo-express:latest
    container_name: project_mongo_express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb
    networks:
      - project_network

volumes:
  mongodb_data:
  minio_data:

networks:
  project_network:
    driver: bridge