
services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: minecraft_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - project_network

  postgres:
    image: postgres:15
    container_name: minecraft-postgres
    environment:
      POSTGRES_DB: minecraft_backend
      POSTGRES_USER: danila
      POSTGRES_PASSWORD: 147852
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project_network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: minecraft_keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: 147852
    ports:
      - "8081:8080"
    networks:
      - project_network

  minio:
    image: minio/minio:latest
    container_name: minecraft_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - project_network

  mongodb:
    image: mongo:7
    container_name: project_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - project_network

  mongo-express:
    image: mongo-express:latest
    container_name: project_mongo_express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb
    networks:
      - project_network

volumes:
  mongodb_data:
  minio_data:
  postgres_data:

networks:
  project_network:
    driver: bridge