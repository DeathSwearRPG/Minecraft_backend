<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#425160"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #55616f; }
      .container-title { font: 700 24px Arial, sans-serif; fill: #1f2933; }
      .section-title { font: 700 18px Arial, sans-serif; fill: #26313d; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #1f2933; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #27313c; }
      .small { font: 400 13px Arial, sans-serif; fill: #52606d; }
      .line { stroke: #425160; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #6b7785; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
      .backend { fill: #ffffff; stroke: #9aa7b8; stroke-width: 2.4; rx: 18; }
      .shared { fill: #f6f8fb; stroke: #a8b2bf; stroke-width: 1.8; rx: 14; }
      .wiki { fill: #eef6ff; stroke: #6fa8dc; stroke-width: 1.8; rx: 14; }
      .auth { fill: #f7efff; stroke: #a987d6; stroke-width: 1.8; rx: 14; }
      .shop { fill: #effaf1; stroke: #72b87b; stroke-width: 1.8; rx: 14; }
      .admin { fill: #fff7e7; stroke: #d7a64b; stroke-width: 1.8; rx: 14; }
      .external { fill: #fff2f2; stroke: #cf6b6b; stroke-width: 1.8; rx: 14; }
      .dbmongo { fill: #eef9ef; stroke: #70ad75; stroke-width: 1.8; rx: 14; }
      .dbpg { fill: #eff5ff; stroke: #6384c4; stroke-width: 1.8; rx: 14; }
      .layer-label { font: 700 16px Arial, sans-serif; fill: #687586; text-transform: uppercase; letter-spacing: .4px; }
      .layer-band { fill: none; stroke: #c7d0db; stroke-width: 1.35; stroke-dasharray: 9 8; rx: 12; }
    </style>
  </defs>

  <rect width="1800" height="1220" fill="#ffffff"/>

  <text x="900" y="54" text-anchor="middle" class="title">Компонентная архитектура backend-приложения Minecraft Wiki</text>
  <text x="900" y="85" text-anchor="middle" class="subtitle">Spring Boot backend: REST API, сервисы, модели, репозитории, БД и внешние интеграции</text>

  <!-- External actors -->
  <rect x="42" y="470" width="170" height="82" class="shared"/>
  <text x="127" y="504" text-anchor="middle" class="box-title">Frontend</text>
  <text x="127" y="530" text-anchor="middle" class="box-text">HTTP REST</text>

  <rect x="1548" y="145" width="200" height="84" class="external"/>
  <text x="1648" y="179" text-anchor="middle" class="box-title">Keycloak</text>
  <text x="1648" y="205" text-anchor="middle" class="box-text">OIDC, роли</text>

  <rect x="1548" y="408" width="200" height="92" class="external"/>
  <text x="1648" y="442" text-anchor="middle" class="box-title">YooKassa</text>
  <text x="1648" y="468" text-anchor="middle" class="box-text">создание платежа</text>
  <text x="1648" y="489" text-anchor="middle" class="box-text">webhook</text>

  <rect x="1548" y="646" width="200" height="92" class="external"/>
  <text x="1648" y="680" text-anchor="middle" class="box-title">Minecraft Server</text>
  <text x="1648" y="706" text-anchor="middle" class="box-text">RCON-команды</text>

  <rect x="1548" y="792" width="200" height="92" class="external"/>
  <text x="1648" y="826" text-anchor="middle" class="box-title">MinIO / S3</text>
  <text x="1648" y="852" text-anchor="middle" class="box-text">хранилище</text>
  <text x="1648" y="873" text-anchor="middle" class="box-text">изображений</text>

  <!-- Backend container -->
  <rect x="250" y="125" width="1245" height="795" class="backend"/>
  <text x="872" y="164" text-anchor="middle" class="container-title">Spring Boot Backend</text>

  <!-- Shared top strip -->
  <rect x="290" y="190" width="1165" height="74" class="shared"/>
  <text x="872" y="221" text-anchor="middle" class="box-title">SecurityConfig</text>
  <text x="872" y="247" text-anchor="middle" class="box-text">OAuth2 Login, проверка ролей USER / ADMIN, CORS, доступ к /api/wiki/** без авторизации</text>

  <!-- Layer boundaries -->
  <rect x="290" y="280" width="1165" height="188" class="layer-band"/>
  <rect x="290" y="488" width="1165" height="162" class="layer-band"/>
  <rect x="290" y="662" width="1165" height="95" class="layer-band"/>
  <rect x="290" y="760" width="1165" height="120" class="layer-band"/>

  <!-- Layer labels -->
  <text x="305" y="316" text-anchor="end" class="layer-label">API</text>
  <text x="305" y="525" text-anchor="end" class="layer-label">Services</text>
  <text x="305" y="705" text-anchor="end" class="layer-label">DTO / Mapper</text>
  <text x="305" y="805" text-anchor="end" class="layer-label">Persistence / Infra</text>

  <!-- Column headers -->
  <rect x="315" y="292" width="250" height="44" class="wiki"/>
  <text x="440" y="320" text-anchor="middle" class="section-title">Wiki / Home</text>

  <rect x="595" y="292" width="250" height="44" class="auth"/>
  <text x="720" y="320" text-anchor="middle" class="section-title">Auth / Profile</text>

  <rect x="875" y="292" width="250" height="44" class="shop"/>
  <text x="1000" y="320" text-anchor="middle" class="section-title">Shop / Payments</text>

  <rect x="1155" y="292" width="250" height="44" class="admin"/>
  <text x="1280" y="320" text-anchor="middle" class="section-title">Admin / Ops</text>

  <!-- API row -->
  <rect x="315" y="355" width="250" height="100" class="wiki"/>
  <text x="440" y="384" text-anchor="middle" class="box-title">Wiki API</text>
  <text x="440" y="410" text-anchor="middle" class="box-text">/api/wiki/items</text>
  <text x="440" y="431" text-anchor="middle" class="box-text">/mobs /bosses /pets /classes</text>

  <rect x="595" y="355" width="250" height="100" class="auth"/>
  <text x="720" y="384" text-anchor="middle" class="box-title">Auth + Profile API</text>
  <text x="720" y="410" text-anchor="middle" class="box-text">/api/auth/**</text>
  <text x="720" y="431" text-anchor="middle" class="box-text">/api/profile/**</text>

  <rect x="875" y="355" width="250" height="100" class="shop"/>
  <text x="1000" y="384" text-anchor="middle" class="box-title">Shop API</text>
  <text x="1000" y="410" text-anchor="middle" class="box-text">/api/shop/**</text>
  <text x="1000" y="431" text-anchor="middle" class="box-text">/yookassa/webhook</text>

  <rect x="1155" y="355" width="250" height="100" class="admin"/>
  <text x="1280" y="384" text-anchor="middle" class="box-title">Admin API</text>
  <text x="1280" y="410" text-anchor="middle" class="box-text">/api/admin/**</text>
  <text x="1280" y="431" text-anchor="middle" class="box-text">/api/admin/mobs</text>

  <!-- Services row -->
  <rect x="315" y="505" width="250" height="126" class="wiki"/>
  <text x="440" y="535" text-anchor="middle" class="box-title">Wiki Services</text>
  <text x="440" y="561" text-anchor="middle" class="box-text">Item, Mob, Boss, Pet</text>
  <text x="440" y="582" text-anchor="middle" class="box-text">GameClass, HomeSlide</text>
  <text x="440" y="606" text-anchor="middle" class="small">чтение, фильтры, пагинация</text>

  <rect x="595" y="505" width="250" height="126" class="auth"/>
  <text x="720" y="535" text-anchor="middle" class="box-title">CurrentUserService</text>
  <text x="720" y="561" text-anchor="middle" class="box-text">профиль из OIDC user</text>
  <text x="720" y="582" text-anchor="middle" class="box-text">minecraftNickname</text>
  <text x="720" y="606" text-anchor="middle" class="small">get or create user profile</text>

  <rect x="875" y="505" width="250" height="126" class="shop"/>
  <text x="1000" y="535" text-anchor="middle" class="box-title">ShopService</text>
  <text x="1000" y="561" text-anchor="middle" class="box-text">создание платежа</text>
  <text x="1000" y="582" text-anchor="middle" class="box-text">обработка webhook</text>
  <text x="1000" y="606" text-anchor="middle" class="small">выдача покупки через RCON</text>

  <rect x="1155" y="505" width="250" height="126" class="admin"/>
  <text x="1280" y="535" text-anchor="middle" class="box-title">Admin Services</text>
  <text x="1280" y="561" text-anchor="middle" class="box-text">MobService create/update</text>
  <text x="1280" y="582" text-anchor="middle" class="box-text">S3Service upload</text>
  <text x="1280" y="603" text-anchor="middle" class="box-text">MinecraftRconService</text>

  <!-- Mapping strip -->
  <rect x="315" y="675" width="1090" height="70" class="shared"/>
  <text x="860" y="704" text-anchor="middle" class="box-title">DTO / Mapper layer</text>
  <text x="860" y="730" text-anchor="middle" class="box-text">ResponseDto, DetailsDto, CreateDto, UpdateDto отделяют API-контракт от моделей и сущностей</text>

  <!-- Persistence row -->
  <rect x="315" y="770" width="250" height="94" class="wiki"/>
  <text x="440" y="802" text-anchor="middle" class="box-title">Mongo Repositories</text>
  <text x="440" y="828" text-anchor="middle" class="box-text">MongoRepository</text>
  <text x="440" y="849" text-anchor="middle" class="box-text">custom MongoTemplate queries</text>

  <rect x="595" y="770" width="250" height="94" class="auth"/>
  <text x="720" y="802" text-anchor="middle" class="box-title">JPA Repository</text>
  <text x="720" y="828" text-anchor="middle" class="box-text">UserProfileRepository</text>

  <rect x="875" y="770" width="250" height="94" class="shop"/>
  <text x="1000" y="802" text-anchor="middle" class="box-title">JPA Repositories</text>
  <text x="1000" y="828" text-anchor="middle" class="box-text">ProductRepository</text>
  <text x="1000" y="849" text-anchor="middle" class="box-text">PurchaseRepository</text>

  <rect x="1155" y="770" width="250" height="94" class="admin"/>
  <text x="1280" y="802" text-anchor="middle" class="box-title">Infra Clients</text>
  <text x="1280" y="828" text-anchor="middle" class="box-text">S3 client</text>
  <text x="1280" y="849" text-anchor="middle" class="box-text">RCON client</text>

  <!-- Data stores -->
  <rect x="335" y="955" width="230" height="88" class="dbmongo"/>
  <text x="450" y="990" text-anchor="middle" class="box-title">MongoDB</text>
  <text x="450" y="1016" text-anchor="middle" class="box-text">wiki-контент</text>
  <text x="450" y="1037" text-anchor="middle" class="box-text">items, mobs, slides</text>

  <rect x="690" y="955" width="280" height="88" class="dbpg"/>
  <text x="830" y="990" text-anchor="middle" class="box-title">PostgreSQL</text>
  <text x="830" y="1016" text-anchor="middle" class="box-text">profiles, products</text>
  <text x="830" y="1037" text-anchor="middle" class="box-text">purchases</text>

  <rect x="1028" y="955" width="280" height="88" class="shared"/>
  <text x="1168" y="990" text-anchor="middle" class="box-title">Migrations / seed</text>
  <text x="1168" y="1016" text-anchor="middle" class="box-text">Mongock для MongoDB</text>
  <text x="1168" y="1037" text-anchor="middle" class="box-text">Flyway для PostgreSQL</text>

  <!-- Main arrows -->
  <path d="M 212 511 L 225 511 L 225 405 L 290 405" class="line"/>

  <path d="M 1648 229 L 1455 227" class="line"/>
  <path d="M 872 264 L 872 292" class="soft-line"/>

  <path d="M 440 455 L 440 505" class="line"/>
  <path d="M 720 455 L 720 505" class="line"/>
  <path d="M 1000 455 L 1000 505" class="line"/>
  <path d="M 1280 455 L 1280 505" class="line"/>

  <path d="M 440 631 L 440 675" class="soft-line"/>
  <path d="M 720 631 L 720 675" class="soft-line"/>
  <path d="M 1000 631 L 1000 675" class="soft-line"/>
  <path d="M 1280 631 L 1280 675" class="soft-line"/>

  <path d="M 440 745 L 440 770" class="line"/>
  <path d="M 720 745 L 720 770" class="line"/>
  <path d="M 1000 745 L 1000 770" class="line"/>
  <path d="M 1280 631 L 1280 770" class="line"/>

  <path d="M 440 864 L 440 910 L 450 955" class="line"/>
  <path d="M 720 864 L 720 910 L 830 955" class="line"/>
  <path d="M 1000 864 L 1000 910 L 830 955" class="line"/>
  <path d="M 1168 955 L 450 955" class="soft-line dashed"/>
  <path d="M 1168 955 L 830 955" class="soft-line dashed"/>

  <!-- External integration arrows -->
  <path d="M 1000 505 L 1000 475 L 1548 475" class="line"/>
  <path d="M 1405 817 L 1548 838" class="line"/>
  <path d="M 1405 817 L 1548 692" class="soft-line"/>

  <!-- Notes -->
  <text x="326" y="1080" class="small">Главная идея: один backend, но внутри он разделен на смысловые модули; Wiki живет в MongoDB, магазин и профили — в PostgreSQL.</text>
</svg>
