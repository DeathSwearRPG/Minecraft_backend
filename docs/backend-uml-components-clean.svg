<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2f3a45"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#b84a4a"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .package-title { font: 700 18px Arial, sans-serif; fill: #1f2937; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #1f2937; }
      .box-text { font: 13px Arial, sans-serif; fill: #1f2937; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .edge-label { font: 12px Arial, sans-serif; fill: #334155; }
      .backend { fill: #ffffff; stroke: #94a3b8; stroke-width: 2.5; }
      .pkg-blue { fill: #f2f8ff; stroke: #68a6e8; stroke-width: 1.8; stroke-dasharray: 10 9; }
      .pkg-purple { fill: #f8f1ff; stroke: #a978dc; stroke-width: 1.8; stroke-dasharray: 10 9; }
      .pkg-green { fill: #f2fbf4; stroke: #62ad74; stroke-width: 1.8; stroke-dasharray: 10 9; }
      .pkg-amber { fill: #fff8eb; stroke: #d89933; stroke-width: 1.8; stroke-dasharray: 10 9; }
      .blue { fill: #e6f2ff; stroke: #68a6e8; stroke-width: 2; }
      .purple { fill: #f3e9ff; stroke: #a978dc; stroke-width: 2; }
      .green { fill: #e8f6ec; stroke: #62ad74; stroke-width: 2; }
      .amber { fill: #fff3db; stroke: #d89933; stroke-width: 2; }
      .neutral { fill: #f3f6fa; stroke: #9aa7b8; stroke-width: 2; }
      .external { fill: #fff0f0; stroke: #d96b6b; stroke-width: 2; }
      .data-green { fill: #edf8f0; stroke: #68aa78; stroke-width: 2; }
      .data-blue { fill: #eef4ff; stroke: #668dd3; stroke-width: 2; }
      .line { fill: none; stroke: #2f3a45; stroke-width: 2; marker-end: url(#arrow); }
      .line-thin { fill: none; stroke: #2f3a45; stroke-width: 1.6; marker-end: url(#arrow); }
      .line-dashed { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .line-red { fill: none; stroke: #b84a4a; stroke-width: 2; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect x="0" y="0" width="1900" height="1280" fill="#ffffff"/>
  <text x="950" y="44" text-anchor="middle" class="title">UML-диаграмма компонентов backend-приложения Minecraft Wiki</text>

  <!-- Top actor -->
  <g>
    <rect x="835" y="70" width="230" height="70" rx="9" class="neutral"/>
    <text x="950" y="99" text-anchor="middle" class="box-title">Frontend</text>
    <text x="950" y="121" text-anchor="middle" class="box-text">HTTP methods</text>
  </g>

  <!-- Backend boundary -->
  <rect x="105" y="160" width="1440" height="900" rx="24" class="backend"/>
  <text x="145" y="205" class="title" style="font-size:26px">Spring Boot Backend</text>

  <!-- Security -->
  <g>
    <rect x="270" y="220" width="1150" height="78" rx="8" class="neutral"/>
    <text x="845" y="250" text-anchor="middle" class="box-title">SecurityConfig</text>
    <text x="845" y="272" text-anchor="middle" class="box-text">OAuth2 Login, роли USER / ADMIN, CORS, правила доступа к /api/**</text>
  </g>

  <!-- External systems -->
  <g>
    <rect x="1610" y="220" width="230" height="80" rx="9" class="external"/>
    <text x="1725" y="253" text-anchor="middle" class="box-title">Keycloak</text>
    <text x="1725" y="276" text-anchor="middle" class="box-text">OIDC, роли</text>
  </g>
  <g>
    <rect x="1610" y="430" width="230" height="90" rx="9" class="external"/>
    <text x="1725" y="463" text-anchor="middle" class="box-title">YooKassa</text>
    <text x="1725" y="486" text-anchor="middle" class="box-text">создание платежа</text>
    <text x="1725" y="506" text-anchor="middle" class="box-text">webhook</text>
  </g>
  <g>
    <rect x="1610" y="660" width="230" height="90" rx="9" class="external"/>
    <text x="1725" y="694" text-anchor="middle" class="box-title">Minecraft Server</text>
    <text x="1725" y="718" text-anchor="middle" class="box-text">RCON-команды</text>
  </g>
  <g>
    <rect x="1610" y="830" width="230" height="90" rx="9" class="external"/>
    <text x="1725" y="864" text-anchor="middle" class="box-title">MinIO / S3</text>
    <text x="1725" y="888" text-anchor="middle" class="box-text">хранилище изображений</text>
  </g>

  <!-- Module packages -->
  <rect x="155" y="330" width="315" height="610" rx="12" class="pkg-blue"/>
  <text x="312.5" y="358" text-anchor="middle" class="package-title">Wiki / Home</text>

  <rect x="500" y="330" width="315" height="610" rx="12" class="pkg-purple"/>
  <text x="657.5" y="358" text-anchor="middle" class="package-title">Auth / Profile</text>

  <rect x="845" y="330" width="315" height="610" rx="12" class="pkg-green"/>
  <text x="1002.5" y="358" text-anchor="middle" class="package-title">Shop / Payments</text>

  <rect x="1190" y="330" width="315" height="610" rx="12" class="pkg-amber"/>
  <text x="1347.5" y="358" text-anchor="middle" class="package-title">Admin / Ops</text>

  <!-- Wiki column -->
  <g>
    <rect x="180" y="380" width="265" height="112" rx="8" class="blue"/>
    <text x="312.5" y="410" text-anchor="middle" class="box-title">Wiki/Home controllers</text>
    <text x="312.5" y="431" text-anchor="middle" class="small">&lt;&lt;controller&gt;&gt;</text>
    <text x="312.5" y="453" text-anchor="middle" class="box-text">Item, Mob, Boss, Pet</text>
    <text x="312.5" y="473" text-anchor="middle" class="box-text">GameClass, Info controllers</text>
  </g>
  <g>
    <rect x="180" y="535" width="265" height="105" rx="8" class="blue"/>
    <text x="312.5" y="563" text-anchor="middle" class="box-title">Wiki/Home DTO + mappers</text>
    <text x="312.5" y="584" text-anchor="middle" class="small">&lt;&lt;mapper&gt;&gt;</text>
    <text x="312.5" y="606" text-anchor="middle" class="box-text">ResponseDto / DetailsDto</text>
    <text x="312.5" y="626" text-anchor="middle" class="box-text">Item, Mob, Boss, Pet, Class, Slide</text>
  </g>
  <g>
    <rect x="180" y="685" width="265" height="122" rx="8" class="green"/>
    <text x="312.5" y="714" text-anchor="middle" class="box-title">Wiki/Home services</text>
    <text x="312.5" y="735" text-anchor="middle" class="small">&lt;&lt;service&gt;&gt;</text>
    <text x="312.5" y="757" text-anchor="middle" class="box-text">ItemService, MobService</text>
    <text x="312.5" y="777" text-anchor="middle" class="box-text">BossService, PetService</text>
    <text x="312.5" y="797" text-anchor="middle" class="box-text">GameClassService, HomeSlideService</text>
  </g>
  <g>
    <rect x="180" y="848" width="265" height="82" rx="8" class="purple"/>
    <text x="312.5" y="876" text-anchor="middle" class="box-title">Mongo repositories</text>
    <text x="312.5" y="897" text-anchor="middle" class="small">&lt;&lt;repository&gt;&gt;</text>
    <text x="312.5" y="918" text-anchor="middle" class="box-text">MongoRepository + MongoTemplate queries</text>
  </g>

  <!-- Auth column -->
  <g>
    <rect x="525" y="380" width="265" height="112" rx="8" class="purple"/>
    <text x="657.5" y="410" text-anchor="middle" class="box-title">Auth + Profile controllers</text>
    <text x="657.5" y="431" text-anchor="middle" class="small">&lt;&lt;controller&gt;&gt;</text>
    <text x="657.5" y="453" text-anchor="middle" class="box-text">AuthController</text>
    <text x="657.5" y="473" text-anchor="middle" class="box-text">ProfileController</text>
  </g>
  <g>
    <rect x="525" y="535" width="265" height="105" rx="8" class="purple"/>
    <text x="657.5" y="563" text-anchor="middle" class="box-title">Auth/Profile payload</text>
    <text x="657.5" y="584" text-anchor="middle" class="small">&lt;&lt;dto/payload&gt;&gt;</text>
    <text x="657.5" y="606" text-anchor="middle" class="box-text">OIDC claims, roles</text>
    <text x="657.5" y="626" text-anchor="middle" class="box-text">UserProfile response, nickname</text>
  </g>
  <g>
    <rect x="525" y="685" width="265" height="122" rx="8" class="green"/>
    <text x="657.5" y="714" text-anchor="middle" class="box-title">CurrentUserService</text>
    <text x="657.5" y="735" text-anchor="middle" class="small">&lt;&lt;service&gt;&gt;</text>
    <text x="657.5" y="757" text-anchor="middle" class="box-text">профиль из OIDC user</text>
    <text x="657.5" y="777" text-anchor="middle" class="box-text">get or create user profile</text>
    <text x="657.5" y="797" text-anchor="middle" class="box-text">minecraftNickname</text>
  </g>
  <g>
    <rect x="525" y="848" width="265" height="82" rx="8" class="purple"/>
    <text x="657.5" y="876" text-anchor="middle" class="box-title">UserProfileRepository</text>
    <text x="657.5" y="897" text-anchor="middle" class="small">&lt;&lt;repository&gt;&gt;</text>
    <text x="657.5" y="918" text-anchor="middle" class="box-text">JpaRepository&lt;UserProfile, Long&gt;</text>
  </g>

  <!-- Shop column -->
  <g>
    <rect x="870" y="380" width="265" height="112" rx="8" class="green"/>
    <text x="1002.5" y="410" text-anchor="middle" class="box-title">ShopController</text>
    <text x="1002.5" y="431" text-anchor="middle" class="small">&lt;&lt;controller&gt;&gt;</text>
    <text x="1002.5" y="453" text-anchor="middle" class="box-text">/api/shop</text>
    <text x="1002.5" y="473" text-anchor="middle" class="box-text">/purchase/{productId}, /webhook</text>
  </g>
  <g>
    <rect x="870" y="535" width="265" height="105" rx="8" class="green"/>
    <text x="1002.5" y="563" text-anchor="middle" class="box-title">Shop payloads</text>
    <text x="1002.5" y="584" text-anchor="middle" class="small">&lt;&lt;dto/payload&gt;&gt;</text>
    <text x="1002.5" y="606" text-anchor="middle" class="box-text">Product response, confirmationUrl</text>
    <text x="1002.5" y="626" text-anchor="middle" class="box-text">YooKassa webhook Map</text>
  </g>
  <g>
    <rect x="870" y="685" width="265" height="122" rx="8" class="green"/>
    <text x="1002.5" y="714" text-anchor="middle" class="box-title">ShopService</text>
    <text x="1002.5" y="735" text-anchor="middle" class="small">&lt;&lt;service&gt;&gt;</text>
    <text x="1002.5" y="757" text-anchor="middle" class="box-text">создание платежа</text>
    <text x="1002.5" y="777" text-anchor="middle" class="box-text">обработка webhook</text>
    <text x="1002.5" y="797" text-anchor="middle" class="box-text">выдача покупки через RCON</text>
  </g>
  <g>
    <rect x="870" y="848" width="265" height="82" rx="8" class="purple"/>
    <text x="1002.5" y="876" text-anchor="middle" class="box-title">Product / Purchase repositories</text>
    <text x="1002.5" y="897" text-anchor="middle" class="small">&lt;&lt;repository&gt;&gt;</text>
    <text x="1002.5" y="918" text-anchor="middle" class="box-text">JpaRepository&lt;Product/Purchase, Long&gt;</text>
  </g>

  <!-- Admin column -->
  <g>
    <rect x="1215" y="380" width="265" height="112" rx="8" class="amber"/>
    <text x="1347.5" y="410" text-anchor="middle" class="box-title">Admin controllers</text>
    <text x="1347.5" y="431" text-anchor="middle" class="small">&lt;&lt;controller&gt;&gt;</text>
    <text x="1347.5" y="453" text-anchor="middle" class="box-text">AdminController</text>
    <text x="1347.5" y="473" text-anchor="middle" class="box-text">AdminMobController</text>
  </g>
  <g>
    <rect x="1215" y="535" width="265" height="105" rx="8" class="amber"/>
    <text x="1347.5" y="563" text-anchor="middle" class="box-title">Admin DTO + mappers</text>
    <text x="1347.5" y="584" text-anchor="middle" class="small">&lt;&lt;mapper&gt;&gt;</text>
    <text x="1347.5" y="606" text-anchor="middle" class="box-text">MobCreateDto / MobUpdateDto</text>
    <text x="1347.5" y="626" text-anchor="middle" class="box-text">MobMapper, upload params</text>
  </g>
  <g>
    <rect x="1215" y="685" width="265" height="122" rx="8" class="green"/>
    <text x="1347.5" y="714" text-anchor="middle" class="box-title">Admin services</text>
    <text x="1347.5" y="735" text-anchor="middle" class="small">&lt;&lt;service&gt;&gt;</text>
    <text x="1347.5" y="757" text-anchor="middle" class="box-text">MobService create/update</text>
    <text x="1347.5" y="777" text-anchor="middle" class="box-text">S3Service upload</text>
    <text x="1347.5" y="797" text-anchor="middle" class="box-text">MinecraftRconService</text>
  </g>
  <g>
    <rect x="1215" y="848" width="125" height="82" rx="8" class="amber"/>
    <text x="1277.5" y="877" text-anchor="middle" class="box-title">S3Client</text>
    <text x="1277.5" y="899" text-anchor="middle" class="small">&lt;&lt;infra&gt;&gt;</text>
    <text x="1277.5" y="919" text-anchor="middle" class="box-text">AWS SDK</text>
  </g>
  <g>
    <rect x="1355" y="848" width="125" height="82" rx="8" class="amber"/>
    <text x="1417.5" y="877" text-anchor="middle" class="box-title">RCON</text>
    <text x="1417.5" y="899" text-anchor="middle" class="small">&lt;&lt;infra&gt;&gt;</text>
    <text x="1417.5" y="919" text-anchor="middle" class="box-text">Rcon client</text>
  </g>

  <!-- Migration boxes -->
  <g>
    <rect x="420" y="975" width="285" height="62" rx="8" class="neutral"/>
    <text x="562.5" y="1001" text-anchor="middle" class="box-title">Mongock change units</text>
    <text x="562.5" y="1024" text-anchor="middle" class="box-text">V001-V005 seed wiki documents</text>
  </g>
  <g>
    <rect x="830" y="975" width="285" height="62" rx="8" class="neutral"/>
    <text x="972.5" y="1001" text-anchor="middle" class="box-title">Flyway migrations</text>
    <text x="972.5" y="1024" text-anchor="middle" class="box-text">V1 PostgreSQL schema</text>
  </g>

  <!-- Data stores -->
  <g>
    <rect x="250" y="1140" width="320" height="90" rx="10" class="data-green"/>
    <text x="410" y="1172" text-anchor="middle" class="box-title">MongoDB</text>
    <text x="410" y="1195" text-anchor="middle" class="box-text">mobs, items</text>
    <text x="410" y="1215" text-anchor="middle" class="box-text">gameClasses, homeSlides</text>
  </g>
  <g>
    <rect x="720" y="1140" width="350" height="90" rx="10" class="data-blue"/>
    <text x="895" y="1172" text-anchor="middle" class="box-title">PostgreSQL</text>
    <text x="895" y="1195" text-anchor="middle" class="box-text">user_profiles, products</text>
    <text x="895" y="1215" text-anchor="middle" class="box-text">purchases</text>
  </g>

  <!-- Main arrows -->
  <path class="line" d="M950 140 L950 220"/>
  <text x="966" y="183" class="edge-label">HTTP</text>

  <path class="line" d="M1420 259 L1610 259"/>
  <text x="1488" y="247" class="edge-label">OAuth2/OIDC</text>

  <path class="line-thin" d="M312.5 298 L312.5 380"/>
  <path class="line-thin" d="M657.5 298 L657.5 380"/>
  <path class="line-thin" d="M1002.5 298 L1002.5 380"/>
  <path class="line-thin" d="M1347.5 298 L1347.5 380"/>

  <path class="line-thin" d="M312.5 492 L312.5 535"/>
  <path class="line-thin" d="M312.5 640 L312.5 685"/>
  <path class="line-thin" d="M312.5 807 L312.5 848"/>

  <path class="line-thin" d="M657.5 492 L657.5 535"/>
  <path class="line-thin" d="M657.5 640 L657.5 685"/>
  <path class="line-thin" d="M657.5 807 L657.5 848"/>

  <path class="line-thin" d="M1002.5 492 L1002.5 535"/>
  <path class="line-thin" d="M1002.5 640 L1002.5 685"/>
  <path class="line-thin" d="M1002.5 807 L1002.5 848"/>

  <path class="line-thin" d="M1347.5 492 L1347.5 535"/>
  <path class="line-thin" d="M1347.5 640 L1347.5 685"/>
  <path class="line-thin" d="M1307 807 L1277.5 848"/>
  <path class="line-thin" d="M1388 807 L1417.5 848"/>

  <!-- Cross-module dependencies -->
  <path class="line-dashed" d="M870 746 L790 746"/>
  <text x="815" y="735" class="edge-label">профиль</text>

  <path class="line-dashed" d="M1215 746 L1170 746 L1170 960 L312.5 960 L312.5 930"/>

  <path class="line-thin" d="M1135 780 L1170 780 L1170 833 L1417.5 833 L1417.5 848"/>

  <!-- Payment and external arrows -->
  <path class="line" d="M1135 746 L1170 746 L1170 960 L1565 960 L1565 475 L1610 475"/>

  <path class="line-red" d="M1610 455 L1565 455 L1565 345 L1002.5 345 L1002.5 380"/>
  <text x="1375" y="335" class="edge-label">webhook</text>

  <path class="line" d="M1277.5 930 L1277.5 950 L1580 950 L1580 875 L1610 875"/>
  <path class="line" d="M1480 889 L1540 889 L1540 705 L1610 705"/>

  <!-- Repository to storage arrows -->
  <path class="line" d="M312.5 930 L312.5 1080 L410 1080 L410 1140"/>
  <path class="line" d="M657.5 930 L657.5 1080 L895 1080 L895 1140"/>
  <path class="line" d="M1002.5 930 L1002.5 1080 L895 1080 L895 1140"/>

  <path class="line" d="M562.5 1037 L562.5 1090 L410 1090 L410 1140"/>
