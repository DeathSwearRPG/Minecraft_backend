<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950">
  <defs>
    <marker id="one" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M6 1 L6 11" stroke="#2f3a45" stroke-width="1.8"/>
    </marker>
    <marker id="many" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto">
      <circle cx="4" cy="9" r="2.5" fill="#fff" stroke="#2f3a45" stroke-width="1.5"/>
      <path d="M8 9 L16 2 M8 9 L16 9 M8 9 L16 16" stroke="#2f3a45" stroke-width="1.5" fill="none"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #17212b; }
      .table { fill: #ffffff; stroke: #2f3a45; stroke-width: 2; }
      .head { fill: #eef1f5; stroke: #2f3a45; stroke-width: 2; }
      .colhead { fill: #f7f8fa; stroke: #ccd3dc; stroke-width: 1; }
      .grid { stroke: #ccd3dc; stroke-width: 1; }
      .table-title { font: 700 18px Arial, sans-serif; fill: #17212b; }
      .cell { font: 15px Arial, sans-serif; fill: #17212b; }
      .cell-bold { font: 700 15px Arial, sans-serif; fill: #17212b; }
      .note { font: 14px Arial, sans-serif; fill: #52606d; }
      .rel { stroke: #2f3a45; stroke-width: 2.2; fill: none; marker-start: url(#one); marker-end: url(#many); }
      .label-bg { fill: #fff; }
    </style>
  </defs>

  <rect width="1400" height="950" fill="#ffffff"/>
  <text x="700" y="58" text-anchor="middle" class="title">ER-диаграмма таблиц PostgreSQL</text>
  <rect x="505" y="92" width="390" height="42" fill="#f6f8fb" stroke="#a8b2bf" stroke-width="1.4"/>
  <text x="700" y="119" text-anchor="middle" class="note">PK — первичный ключ, FK — внешний ключ</text>

  <!-- user_profiles -->
  <g transform="translate(80 165)">
    <rect width="470" height="220" class="table"/>
    <rect width="470" height="44" class="head"/>
    <text x="18" y="28" class="table-title">user_profiles</text>
    <rect y="44" width="470" height="34" class="colhead"/>
    <line x1="72" y1="44" x2="72" y2="220" class="grid"/>
    <line x1="275" y1="44" x2="275" y2="220" class="grid"/>
    <text x="18" y="66" class="cell-bold">Ключ</text>
    <text x="88" y="66" class="cell-bold">Поле</text>
    <text x="292" y="66" class="cell-bold">Тип</text>
    <line x1="0" y1="78" x2="470" y2="78" class="grid"/>
    <line x1="0" y1="113" x2="470" y2="113" class="grid"/>
    <line x1="0" y1="148" x2="470" y2="148" class="grid"/>
    <line x1="0" y1="183" x2="470" y2="183" class="grid"/>
    <text x="18" y="100" class="cell">PK</text><text x="88" y="100" class="cell">id</text><text x="292" y="100" class="cell">BIGSERIAL</text>
    <text x="88" y="135" class="cell">keycloak_sub</text><text x="292" y="135" class="cell">VARCHAR(255)</text>
    <text x="88" y="170" class="cell">username</text><text x="292" y="170" class="cell">VARCHAR(255)</text>
    <text x="88" y="205" class="cell">minecraft_nickname</text><text x="292" y="205" class="cell">VARCHAR(255)</text>
  </g>

  <!-- products -->
  <g transform="translate(850 135)">
    <rect width="500" height="330" class="table"/>
    <rect width="500" height="44" class="head"/>
    <text x="18" y="28" class="table-title">products</text>
    <rect y="44" width="500" height="34" class="colhead"/>
    <line x1="72" y1="44" x2="72" y2="330" class="grid"/>
    <line x1="275" y1="44" x2="275" y2="330" class="grid"/>
    <text x="18" y="66" class="cell-bold">Ключ</text>
    <text x="88" y="66" class="cell-bold">Поле</text>
    <text x="292" y="66" class="cell-bold">Тип</text>
    <line x1="0" y1="78" x2="500" y2="78" class="grid"/>
    <line x1="0" y1="113" x2="500" y2="113" class="grid"/>
    <line x1="0" y1="148" x2="500" y2="148" class="grid"/>
    <line x1="0" y1="183" x2="500" y2="183" class="grid"/>
    <line x1="0" y1="218" x2="500" y2="218" class="grid"/>
    <line x1="0" y1="253" x2="500" y2="253" class="grid"/>
    <text x="18" y="100" class="cell">PK</text><text x="88" y="100" class="cell">id</text><text x="292" y="100" class="cell">BIGSERIAL</text>
    <text x="88" y="135" class="cell">product_name</text><text x="292" y="135" class="cell">VARCHAR(255)</text>
    <text x="88" y="170" class="cell">description</text><text x="292" y="170" class="cell">VARCHAR(1000)</text>
    <text x="88" y="205" class="cell">price</text><text x="292" y="205" class="cell">NUMERIC(10,2)</text>
    <text x="88" y="240" class="cell">image_url</text><text x="292" y="240" class="cell">VARCHAR(255)</text>
    <text x="88" y="275" class="cell">command_to_grant</text><text x="292" y="275" class="cell">VARCHAR(255)</text>
    <text x="88" y="306" class="cell">active</text><text x="292" y="306" class="cell">BOOLEAN</text>
  </g>

  <!-- purchases -->
  <g transform="translate(460 505)">
    <rect width="520" height="350" class="table"/>
    <rect width="520" height="44" class="head"/>
    <text x="18" y="28" class="table-title">purchases</text>
    <rect y="44" width="520" height="34" class="colhead"/>
    <line x1="72" y1="44" x2="72" y2="350" class="grid"/>
    <line x1="275" y1="44" x2="275" y2="350" class="grid"/>
    <text x="18" y="66" class="cell-bold">Ключ</text>
    <text x="88" y="66" class="cell-bold">Поле</text>
    <text x="292" y="66" class="cell-bold">Тип</text>
    <line x1="0" y1="78" x2="520" y2="78" class="grid"/>
    <line x1="0" y1="113" x2="520" y2="113" class="grid"/>
    <line x1="0" y1="148" x2="520" y2="148" class="grid"/>
    <line x1="0" y1="183" x2="520" y2="183" class="grid"/>
    <line x1="0" y1="218" x2="520" y2="218" class="grid"/>
    <line x1="0" y1="253" x2="520" y2="253" class="grid"/>
    <line x1="0" y1="288" x2="520" y2="288" class="grid"/>
    <line x1="0" y1="323" x2="520" y2="323" class="grid"/>
    <text x="18" y="100" class="cell">PK</text><text x="88" y="100" class="cell">id</text><text x="292" y="100" class="cell">BIGSERIAL</text>
    <text x="18" y="135" class="cell">FK</text><text x="88" y="135" class="cell">user_profile_id</text><text x="292" y="135" class="cell">BIGINT</text>
    <text x="18" y="170" class="cell">FK</text><text x="88" y="170" class="cell">product_id</text><text x="292" y="170" class="cell">BIGINT</text>
    <text x="88" y="205" class="cell">product_name</text><text x="292" y="205" class="cell">VARCHAR(255)</text>
    <text x="88" y="240" class="cell">price</text><text x="292" y="240" class="cell">NUMERIC(10,2)</text>
    <text x="88" y="275" class="cell">created_at</text><text x="292" y="275" class="cell">TIMESTAMP</text>
    <text x="88" y="310" class="cell">status</text><text x="292" y="310" class="cell">VARCHAR(50)</text>
    <text x="88" y="340" class="cell">transaction_id</text><text x="292" y="340" class="cell">VARCHAR(255)</text>
  </g>

  <!-- relations -->
  <path d="M315 385 L315 455 L590 455 L590 505" class="rel"/>
  <rect x="512" y="440" width="92" height="24" class="label-bg"/>
  <text x="558" y="457" text-anchor="middle" class="cell-bold">1 : 0..N</text>

  <path d="M1100 465 L1100 485 L850 485 L850 505" class="rel"/>
  <rect x="910" y="470" width="92" height="24" class="label-bg"/>
  <text x="956" y="487" text-anchor="middle" class="cell-bold">1 : 0..N</text>
</svg>
